<!DOCTYPE html>
<head>

<style>
  img {
    width: 100px;
    height: 100px;
  }

  .thumbnail {
    width: 50px;
    height: 50px;
    margin: 5px;
  }

  .thumbnail:hover {
    cursor: pointer;
  }

  #dino {
    display: block;
    margin: 0 auto;
    width: 95%;
    height: auto;
  }

  .reverse {
    transform: scaleX(-1);
  }

  .bounce {
    animation: bounce 0.15s infinite;
  }

  .selected {
    border: 1px solid red;
  }

  @keyframes bounce {
    0% {
      transform: scaleX(100%) scaleY(100%);
    }
    50% {
      transform: scaleX(115%) scaleY(90%);
    }
    100% {
      transform: scaleX(100%) scaleY(100%);
    }
  }
</style>
<script>
  function select(num) {
    document.getElementById("dino").src = num + ".png";
    document.querySelector("#thumbnails > .selected")?.classList?.remove("selected")
    document.querySelector(".thumbnail-" + num)?.classList?.add("selected")
  }
  window.onload = function() {
    // set the image to 1.png
    select(1)

    // the user can press number keys to set the image. Pressing "1" sets the image to "1.png", etc.
    document.addEventListener("keydown", function(event) {
      // all numeric keys allowed
      if (event.keyCode >= 48 && event.keyCode <= 57) {
        // get the key number
        const num = event.keyCode - 48;

        select(num)
      }

      // flip the page with "r"
      if (event.key === "r") {
        document.getElementById("dino-container").classList.toggle("reverse")

        document.getElementById("dino").classList.add("bounce")
        setTimeout(function() {
          document.getElementById("dino").classList.remove("bounce")
        }, 150)
      }

      // on any keypress, give the image a little shakey bounce
      // but if shift is held down, keep the bounce going
      if (event.shiftKey) {
        document.getElementById("dino").classList.add("bounce")
      } else if (event.keyCode >= 48 && event.keyCode <= 57) {
        document.getElementById("dino").classList.add("bounce")
        setTimeout(function() {
          document.getElementById("dino").classList.remove("bounce")
        }, 150)
      }
    })
    // each image is listed in a thumbnail at the top of the page
    for (var i = 1; i < 9; i++) {
      // create a new image element
      const img = document.createElement("img");
      // set the source
      img.src = i + ".png";
      // set the class
      img.classList.add("thumbnail");
      img.classList.add(`thumbnail-${i}`)
      img.dataset.num = i;
      // add the image to the page
      document.querySelector('#thumbnails').appendChild(img);
      // add an event listener to the image
      img.addEventListener("click", function(event) {
        select(event.target.dataset.num)
      })
    }
  }

</script>
</head>
<body>
  <style>
    .help-text.enabled > .help-short ,
      .help-text > .help-long {
      display: none;
    }
    .help-text > .help-short ,
      .help-text.enabled > .help-long {
      display: inline;
      opacity: 0.5;
    }
  </style>
  <script>
    document.addEventListener("keydown", function(event) {
      if (event.key === "h") {
        document.querySelector(".help-text").classList.toggle("enabled")
      }
    })
  </script>
  <div class="help-text">
    <span class="help-short">
      h - help
    </span>
    <span class="help-long">
      h - help | 1-9 - frame | shift - bounce | r - reverse
    </span>
  </div>
  <div id="thumbnails"></div>
  <div id="dino-container">
    <img src="#" alt="dinosaur" id="dino">
  </div>
</body>
